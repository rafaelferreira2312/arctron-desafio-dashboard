name: arctron-dashboard

x-php: &php
  build:
    context: ./backend
    target: dev
  volumes:
    - ./backend:/app
  environment:
    DATABASE_URL: postgresql://app:app@database:5432/purchases?serverVersion=16&charset=utf8
    MESSENGER_TRANSPORT_DSN: amqp://guest:guest@rabbitmq:5672/%2f/messages
    WOOCOMMERCE_WEBHOOK_SECRET: ${WOOCOMMERCE_WEBHOOK_SECRET:-arctron-webhook-secret}

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: purchases
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d purchases"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  php:
    <<: *php
    environment:
      DATABASE_URL: postgresql://app:app@database:5432/purchases?serverVersion=16&charset=utf8
      MESSENGER_TRANSPORT_DSN: amqp://guest:guest@rabbitmq:5672/%2f/messages
      WOOCOMMERCE_WEBHOOK_SECRET: ${WOOCOMMERCE_WEBHOOK_SECRET:-arctron-webhook-secret}
      RUN_MIGRATIONS: "1"
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-f", "/app/var/.ready"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 120s

  # Consome a fila de pedidos do WooCommerce
  worker:
    <<: *php
    command: ["php", "bin/console", "messenger:consume", "async", "-vv", "--time-limit=3600", "--memory-limit=256M"]
    restart: unless-stopped
    depends_on:
      php:
        condition: service_healthy

  api:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./backend/public:/app/public:ro
      - ./backend/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      php:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

  # ---------- WooCommerce (plataforma de e-commerce integrada) ----------

  wordpress-db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - wordpress_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:6-php8.3-apache
    ports:
      - "8081:80"
    environment: &wordpress-env
      WORDPRESS_DB_HOST: wordpress-db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      ARCTRON_API_HOST: api
    volumes:
      - wordpress_data:/var/www/html
      - ./woocommerce/mu-plugins:/var/www/html/wp-content/mu-plugins:ro
    depends_on:
      wordpress-db:
        condition: service_healthy

  # Roda uma vez: instala o WooCommerce, cria produtos, webhooks e pedidos de exemplo
  woocommerce-setup:
    image: wordpress:cli-php8.3
    user: "33:33"
    entrypoint: ["sh", "/setup/setup.sh"]
    environment:
      <<: *wordpress-env
      WP_URL: http://localhost:8081
      ARCTRON_WEBHOOK_URL: http://api/webhooks/woocommerce
      WOOCOMMERCE_WEBHOOK_SECRET: ${WOOCOMMERCE_WEBHOOK_SECRET:-arctron-webhook-secret}
    volumes:
      - wordpress_data:/var/www/html
      - ./woocommerce/mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      - ./woocommerce:/setup:ro
    depends_on:
      wordpress:
        condition: service_started
      worker:
        condition: service_started
      api:
        condition: service_started
    restart: "no"

volumes:
  postgres_data:
  wordpress_db:
  wordpress_data:
